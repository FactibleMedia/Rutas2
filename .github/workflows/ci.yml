name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      # Uses the lockfile exactly. This previously failed outright because
      # package-lock.json was out of sync with package.json.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Spell check (es/en)
        run: npm run spell:check

      # Build needs the VITE_* vars present or import.meta.env reads are empty.
      # These are client-side public values; set them as repo secrets.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Report bundle sizes
        run: |
          echo "### Bundle sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist/assets -name '*.js' -o -name '*.css' \
            | xargs ls -la 2>/dev/null \
            | awk '{printf "%8.1f KB  %s\n", $5/1024, $9}' \
            | sort -rn >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
